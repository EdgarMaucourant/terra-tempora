# Checks every pull request before it can be published: the data and
# translations (scripts/check-data.mjs), the types, and a full build.
name: Check

on:
  pull_request:
  push:
    branches: [main]

# The check only reads the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
