# Reads the Wikidata events' titles, places and descriptions in every
# interface language (scripts/fetch-translations.mjs) and commits them to
# public/data/i18n/<lang>/wd-events/. Run it by hand from the Actions tab
# after new events are fetched. It doesn't run on pushes: its own commit
# would not get the "check" run a pull request needs, so run it on main.
name: Fetch event translations

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-translations.mjs
      - run: node scripts/check-data.mjs
      - name: Commit the translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898295+github-actions[bot]@users.noreply.github.com"
          git add public/data/i18n
          git diff --cached --quiet && exit 0
          git commit -m "Refresh the Wikidata event translations"
          git push
